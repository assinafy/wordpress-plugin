# Every merge gate for the plugin.
#
# PHPCS, PHPStan and PHPMD are blocking and are never allowed to fail: an unescaped echo or an
# unsanitised $_POST is a wordpress.org rejection, so they are caught here rather than in review.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  # The unit suite carries no WordPress at all — Composer's autoloader plus tests/wp-stubs.php —
  # so it runs across the whole supported PHP range without a database or a WordPress checkout.
  unit:
    name: Unit (PHP ${{ matrix.php }}, ${{ matrix.deps }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: [highest]
        include:
          # The floor and the ceiling of the range, against the oldest dependency set that
          # still satisfies the constraints. Catches a constraint that is looser than the code.
          - php: '8.2'
            deps: lowest
          - php: '8.5'
            deps: lowest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, sodium
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.deps }}
          composer-options: '--prefer-dist'

      - name: Unit suite
        run: vendor/bin/phpunit

  # PHPCS, PHPStan and PHPMD. All three blocking.
  quality:
    name: PHPCS + PHPStan + PHPMD
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          # The floor of the supported range, so PHPCompatibility and PHPStan see it.
          php-version: '8.2'
          extensions: json, mbstring, sodium
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: PHPCS
        run: composer phpcs

      - name: PHPStan
        run: composer phpstan

      - name: PHPMD
        run: composer phpmd

  # The WordPress integration suite runs on PHPUnit 9.6 because the core test library still
  # calls PHPUnit\Util\Test::parseTestMethodAnnotations() and getName( false ), both removed in
  # PHPUnit 10. The test library comes from a wordpress-develop branch tarball: its src/ tree is
  # a runnable WordPress for PHP-level tests and wp-tests-config-sample.php already points
  # ABSPATH at it, so no build step and no SVN checkout are needed.
  integration:
    name: Integration (WordPress ${{ matrix.wp }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '6.8'
            wc: '10.2.2'
          - wp: 'latest'
            wc: 'latest-stable'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ASSINAFY_REQUIRE_WOOCOMMERCE: '1'
      ASSINAFY_GRAVITY_FORMS_CONTRACT: '1'
      ASSINAFY_CF7_FILE: ${{ github.workspace }}/build/hosts/contact-form-7/wp-contact-form-7.php
      ASSINAFY_WPFORMS_FILE: ${{ github.workspace }}/../wpforms-lite/wpforms.php
      WP_TESTS_DIR: ${{ github.workspace }}/.cache/wordpress-develop/tests/phpunit
      WP_TESTS_CONFIG_FILE_PATH: ${{ github.workspace }}/.cache/wordpress-develop/wp-tests-config.php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: json, mbstring, sodium, mysqli
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Resolve the wordpress-develop branch
        # "latest" is resolved through the core version-check API and reduced to its
        # major.minor, which is the wordpress-develop branch name.
        run: |
          mkdir -p .cache
          php -r '$v = getenv("WP_VERSION"); if ($v === "latest") { $j = json_decode((string) file_get_contents("https://api.wordpress.org/core/version-check/1.7/"), true); $v = $j["offers"][0]["current"] ?? ""; } $p = explode(".", $v); if (count($p) < 2) { fwrite(STDERR, "Could not resolve a WordPress branch\n"); exit(1); } file_put_contents(".cache/wp-branch", $p[0] . "." . $p[1]);'
        env:
          WP_VERSION: ${{ matrix.wp }}

      - name: Fetch the WordPress test library
        run: |
          branch="$(cat .cache/wp-branch)"
          curl -fsSL -o .cache/wordpress-develop.tar.gz \
            "https://github.com/WordPress/wordpress-develop/archive/refs/heads/${branch}.tar.gz"
          mkdir -p .cache/wordpress-develop
          tar -xzf .cache/wordpress-develop.tar.gz -C .cache/wordpress-develop --strip-components=1
          sed -e "s/youremptytestdbnamehere/wordpress_test/" \
              -e "s/yourusernamehere/root/" \
              -e "s/yourpasswordhere/wordpress/" \
              -e "s/'localhost'/'127.0.0.1'/" \
              .cache/wordpress-develop/wp-tests-config-sample.php \
              > .cache/wordpress-develop/wp-tests-config.php

      # The WooCommerce integration tests load the plugin from the directory next to this one,
      # exactly as wp-env lays it out. Without it those tests skip instead of running.
      - name: Fetch WooCommerce
        run: |
          curl -fsSL -o /tmp/woocommerce.zip \
            "https://downloads.wordpress.org/plugin/woocommerce.${{ matrix.wc }}.zip"
          unzip -q /tmp/woocommerce.zip -d "$(dirname "${{ github.workspace }}")"

      - name: Fetch tested free form hosts
        run: |
          mkdir -p build/hosts
          curl -fsSL -o /tmp/assinafy-cf7.zip https://downloads.wordpress.org/plugin/contact-form-7.6.1.7.zip
          curl -fsSL -o /tmp/assinafy-wpforms.zip https://downloads.wordpress.org/plugin/wpforms-lite.2.0.1.1.zip
          unzip -q /tmp/assinafy-cf7.zip -d build/hosts
          unzip -q /tmp/assinafy-wpforms.zip -d "$(dirname "${{ github.workspace }}")"

      - name: Integration suite
        run: vendor/bin/phpunit -c phpunit-integration.xml.dist

      # WordPress's own bootstrap excludes the `ajax` group unless it is asked for, so the
      # admin-ajax tests are invisible to the run above. They cover the nonce and capability
      # gates on the two endpoints that reach the API with the site's stored credentials.
      - name: Admin-ajax suite
        run: vendor/bin/phpunit -c phpunit-integration.xml.dist --group ajax

      - name: Multisite lifecycle and privacy suite
        run: WP_MULTISITE=1 vendor/bin/phpunit -c phpunit-integration.xml.dist --filter 'LifecycleTest|UninstallRegistryTest|PrivacyTest|CapabilitiesTest|SettingsTest'

  browser:
    name: Browser admin workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run start
      - run: npm run test:e2e
      - if: always()
        run: npm run stop

  # The regression test for the dependency architecture. The production install carries no
  # Guzzle at all: the SDK's GuzzleHttpClient fallback never runs because a WordPress-native
  # transport is injected at the one construction site, and the Guzzle tree is removed from the
  # install by composer.json's "replace" block. If either regresses, GuzzleHttp\Client becomes
  # loadable again and this job fails.
  runtime-smoke:
    name: Runtime smoke (--no-dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: json, mbstring, sodium
          coverage: none
          tools: composer:v2

      - name: Install the production tree
        run: |
          composer update --with-all-dependencies --prefer-dist --no-progress --classmap-authoritative
          composer install --no-dev --no-scripts --classmap-authoritative

      - name: Platform requirements
        run: composer check-platform-reqs --no-dev

      - name: No Guzzle, and the transport is injected
        # ABSPATH is defined first because every plugin file guards on it and would otherwise
        # exit(0) on load, turning this job green without asserting anything.
        run: php -r 'define("ABSPATH", sys_get_temp_dir() . "/"); require "vendor-prefixed/autoload.php"; if (class_exists("GuzzleHttp\\Client")) { fwrite(STDERR, "Guzzle is installed\n"); exit(1); } $config = new Assinafy\SDK\Configuration("runtime-smoke-key", "runtime-smoke-account", Assinafy\SDK\Configuration::SANDBOX_BASE_URL); $client = new Assinafy\SDK\AssinafyClient($config, new Assinafy\WP\Http\WpHttpClient($config)); if (! $client->getHttpClient() instanceof Assinafy\WP\Http\WpHttpClient) { fwrite(STDERR, "Transport was not injected\n"); exit(1); }'

  # The canonical distribution zip. bin/build-zip.sh applies .distignore and asserts that the
  # plugin header Version and the readme Stable tag agree.
  build-zip:
    name: Distribution zip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: json, mbstring, sodium
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: '--classmap-authoritative'

      - name: Packaging regressions
        run: bash tests/build-zip.sh

      - name: Build
        run: |
          bin/build-zip.sh
          bin/build-addons.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assinafy-dist-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
