# Publishes a validated release to the wordpress.org SVN repository.
#
# The DEPLOY_TO_WPORG repository variable keeps this a no-op until
# wordpress.org approves the slug, so a mirrored tag cannot push into an SVN
# repository that does not exist. Release calls this after CI, Plugin Check and tag validation.
# A manual run is always a dry run and cannot bypass the release checks.
name: Deploy to wordpress.org

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wporg-${{ github.workflow }}-${{ github.ref }}
  # A half-cancelled SVN commit is worse than a slow queue.
  cancel-in-progress: false

jobs:
  deploy:
    name: SVN deploy
    if: ${{ vars.DEPLOY_TO_WPORG == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # SVN has no OIDC path, so SVN_USERNAME and SVN_PASSWORD are unavoidable
    # long-lived secrets. Scope them to this environment with required
    # reviewers.
    environment: wordpress-org
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install build tools and prepare runtime dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Build the distribution tree
        run: bin/build-zip.sh

      - name: Read the packaged version
        id: version
        run: echo "version=$(cat dist/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Verify the release tag
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          test "$TAG_NAME" = "v$(cat dist/VERSION)"

      # Setting BUILD_DIR makes the action ignore .distignore entirely, so
      # bin/build-zip.sh is solely responsible for what reaches SVN trunk.
      # ASSETS_DIR is read from the checkout, not from BUILD_DIR, because
      # banners, icons and screenshots live at the SVN root and never ship in
      # the zip.
      - name: Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: assinafy
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: ./dist/assinafy
          ASSETS_DIR: .wordpress-org
